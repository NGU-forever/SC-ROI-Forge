services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      SC_ROI_AGENT_ENABLED: "1"
    ports:
      - "8000:8000"

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
